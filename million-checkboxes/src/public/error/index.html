<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Page Not Found</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/error/style.css" />
</head>
<body>

<div class="notfound-container">
  <div class="notfound-card">
    
    <h1 class="notfound-code">404</h1>
    <h2 class="notfound-title">Page Not Found</h2>
    
    <p class="notfound-description">
      The page you’re looking for doesn’t exist or has been moved.
    </p>

    <div class="notfound-actions">
      <a href="/" class="notfound-button primary">Go Home</a>
    </div>
  </div>

  <div class="error-card non-visible">
    <h2 class="notfound-title"></h2>
    
    <p class="notfound-description"></p>

    <div class="notfound-actions">
      <a href="/" class="notfound-button primary">Try again</a>
    </div>
  </div>
</div>

<script src="/error/script.js"></script>
</body>
</html>
